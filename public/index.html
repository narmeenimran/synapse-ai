<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse AI - Lecture Study Assistant</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 2.25rem;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .input-section {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 40px;
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 14px;
            font-size: 15px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 12px;
            display: inline-block;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        /* Grid layout for flashcards */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }

        /* 3D Flip Card Effect */
        .flashcard-container {
            background-color: transparent;
            height: 200px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
        }

        .flashcard-container.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid #e2e8f0;
        }

        .flashcard-back {
            transform: rotateY(180deg);
            background-color: #f0f9ff;
            border-color: #bae6fd;
        }

        .tag {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #1e40af;
            background: #dbeafe;
            padding: 4px 10px;
            border-radius: 9999px;
            margin-bottom: 12px;
        }

        .card-hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🧠 Synapse AI</h1>
        <p class="subtitle">Transform lecture transcripts into study flashcards instantly</p>
    </header>

    <div class="input-section">
        <textarea id="lectureInput" placeholder="Paste your lecture notes, key concepts, or text transcript here..."></textarea>
        <button class="btn" onclick="generateCards()">Generate Flashcards</button>
    </div>

    <div id="results"></div>

    <script>
        async function generateCards() {
            const text = document.getElementById('lectureInput').value;
            const resultsDiv = document.getElementById('results');
            
            if (!text.trim()) {
                alert('Please enter some lecture text first!');
                return;
            }

            resultsDiv.innerHTML = '<p style="text-align:center;">🤖 Generating flashcards with Nebius AI & saving to Supabase...</p>';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lectureContent: text })
                });

                const data = await response.json();

                if (data.success) {
                    resultsDiv.innerHTML = `
                        <h2>✨ Generated Flashcards (${data.flashcards.length})</h2>
                        <p class="subtitle">Click any card to flip and reveal the answer.</p>
                        <div class="cards-grid" id="cardsGrid"></div>
                    `;

                    const cardsGrid = document.getElementById('cardsGrid');

                    data.flashcards.forEach(card => {
                        const cardElement = document.createElement('div');
                        cardElement.className = 'flashcard-container';
                        cardElement.onclick = () => cardElement.classList.toggle('flipped');
                        
                        cardElement.innerHTML = `
                            <div class="flashcard-inner">
                                <div class="flashcard-front">
                                    <span class="tag">${card.concept_tag || 'General'}</span>
                                    <p><strong>${card.question}</strong></p>
                                    <span class="card-hint">Click to flip 🔄</span>
                                </div>
                                <div class="flashcard-back">
                                    <p>${card.answer}</p>
                                    <span class="card-hint">Click to flip 🔄</span>
                                </div>
                            </div>
                        `;
                        cardsGrid.appendChild(cardElement);
                    });
                } else {
                    resultsDiv.innerHTML = `<p style="color: red; text-align:center;">Error: ${data.error}</p>`;
                }
            } catch (err) {
                resultsDiv.innerHTML = `<p style="color: red; text-align:center;">Network error occurred while generating flashcards.</p>`;
            }
        }
    </script>
</body>
</html>
